name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The interface: locales, colors, lint, types and unit tests, then the built page in Chrome
  # against the simulated backend.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: UI tests
        run: npm run test:ui
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

  # The Rust core and the app on Windows. The runner is an administrator, so the system tests run
  # too: the TCP and UDP tables, the adapters, a process's program and description, per-process
  # traffic and DNS names from ETW, reverse DNS, and firewall rules for a program that does not
  # exist (added and removed again).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The shell embeds the built page, so it has to exist before the Rust crates compile.
      - run: npm run build:web

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      - name: Windows system tests
        run: cargo test -p netswitch-core --test windows_system -- --include-ignored --test-threads 1

      - name: Installers
        run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: netSwitch-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  # A push to master whose version (package.json, kept equal to the Tauri and Cargo versions) has no
  # release yet publishes one: tag v<version> on that commit, both installers, and the version's
  # CHANGELOG section as the notes. To release, raise the version and push.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: netSwitch-installers
          path: installers

      - name: Publish the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "netSwitch $tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
