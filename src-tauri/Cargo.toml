[package]
name = "netswitch"
version = "0.1.0"
description = "NetSwitch - Network Control & Firewall Manager"
authors = ["Croxz"]
license = "MIT"
repository = "https://github.com/bugragungoz/netswitch"
edition = "2021"

[lib]
name = "netswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
